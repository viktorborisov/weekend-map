services:
  backend:
    build: ./backend
    container_name: weekend-map-backend
    network_mode: host
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,194.87.239.102
      - OVERPASS_API_URL=https://overpass-api.de/api/interpreter
      - CACHE_OVERPASS_SECONDS=3600
      - GUNICORN_PORT=8001
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: weekend-map-frontend
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    restart: unless-stopped

volumes:
  db_data:
  media_data:

volumes:
  db_data:
  media_data:
